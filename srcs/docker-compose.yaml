services:

# MARIADB #
  mariadb:
    image: mariadb
    container_name: mariadb
    build:
      context: requirements/mariadb
    env_file:
      - .env
    environment:
      MARIADB_ROOT_PASSWORD_FILE: /run/secrets/db_root_password.txt
      MARIADB_PASSWORD_FILE: /run/secrets/db_password.txt
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - backend
    secrets:
      - db_password.txt
      - db_root_password.txt
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h localhost -u root -p\"$(cat /run/secrets/db_root_password.txt)z\""]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

# VOLUMES #
volumes:
  db_data:
    driver: local
    driver_opts:
      type: none
      device: /home/ekeisler/data/mariadb
      o: bind

# NETWORKS #
networks:

  backend:
    driver: bridge
    name: backend
    internal: true

# SECRETS #
secrets:
 
 # MARIADB #
    db_password.txt:
      file: "../secrets/mariadb/db_password.txt"
    db_root_password.txt:
      file: "../secrets/mariadb/db_root_password.txt"