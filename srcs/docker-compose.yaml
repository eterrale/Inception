services:

# MARIADB #
  mariadb:
    image: mariadb:1.0
    container_name: mariadb
    build:
      context: requirements/mariadb
    pull_policy: build
    env_file:
      - .env
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - backend
    secrets:
      - db_password.txt
      - db_root_password.txt
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h localhost -u root -p\"$(cat /run/secrets/db_root_password.txt)\""]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

# WORDPRESS #
  wordpress:
    image: wordpress:1.0
    container_name: wordpress
    build:
      context: requirements/wordpress
    pull_policy: build
    env_file:
      - .env
    depends_on:
      mariadb:
        condition: service_healthy
    volumes:
      - wp_data:/var/www/html
    networks:
      - backend
    secrets:
      - db_password.txt
      - wp_admin_password.txt
      - wp_user_password.txt
    restart: unless-stopped

# NGINX #
  nginx:
    image: nginx:1.0
    container_name: nginx
    build:
      context: requirements/nginx
    pull_policy: build
    env_file:
      - .env
    depends_on:
      wordpress:
        condition: service_started
    ports:
      - "443:443"
    volumes:
      - wp_data:/var/www/html:ro
    networks:
      - backend
      - frontend
    restart: unless-stopped

# VOLUMES #
volumes:
  db_data:
    driver: local
    driver_opts:
      type: none
      device: /home/ekeisler/data/mariadb
      o: bind
  wp_data:
    driver: local
    driver_opts:
      type: none
      device: /home/ekeisler/data/wordpress
      o: bind

# NETWORKS #
networks:

  backend:
    driver: bridge
    internal: true

  frontend:
    driver: bridge

# SECRETS #
secrets:

 # MARIADB #
    db_password.txt:
      file: "../secrets/mariadb/db_password.txt"
    db_root_password.txt:
      file: "../secrets/mariadb/db_root_password.txt"

 # WORDPRESS #
    wp_admin_password.txt:
      file: "../secrets/wordpress/wp_admin_password.txt"
    wp_user_password.txt:
      file: "../secrets/wordpress/wp_user_password.txt"